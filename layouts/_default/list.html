{{ define "main" }}

<section class="section"><div class="container card-list">{{ range .Pages.ByDate.Reverse }}<article class="content-card"><p class="eyebrow">{{ .Date.Format "02.01.2006" }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Params.summary }}</p><a class="text-link" href="{{ .RelPermalink }}">Czytaj →</a></article>{{ end }}</div></section>
{{ end }}
