{{ define "main" }}
<section class="page-hero"><div class="container narrow"><p class="eyebrow">Dziennik LOOP</p><h1>Blog</h1><p>{{ .Params.description }}</p></div></section>
<section class="section"><div class="container narrow card-list">{{ range .Pages.ByDate.Reverse }}<article class="content-card"><p class="eyebrow">{{ .Date.Format "02.01.2006" }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Params.summary }}</p><a class="text-link" href="{{ .RelPermalink }}">Czytaj →</a></article>{{ end }}</div></section>
{{ end }}
