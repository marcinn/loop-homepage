{{ $p := . }}
<article class="project-card{{ if $p.Params.highlight }} project-card--highlight{{ end }}">
  <a class="project-card__image" href="{{ $p.RelPermalink }}">
    <img src="{{ partial "img.html" $p.Params.image }}" alt="Podgląd projektu {{ $p.Title }}" loading="lazy">
  </a>
  <div class="project-card__body">
    <div class="project-card__topline">
      <h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
      <span class="status-pill">{{ $p.Params.status }}</span>
    </div>
    <p>{{ or $p.Params.card_summary $p.Params.summary }}</p>
    <a class="text-link" href="{{ $p.RelPermalink }}">Zobacz projekt →</a>
  </div>
</article>
